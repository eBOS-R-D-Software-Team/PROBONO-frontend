server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/csv application/javascript application/json
               application/xml image/svg+xml application/octet-stream;

    # Liveness/readiness probe for Docker and k8s
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # CRA output is content-hashed, so it can be cached forever
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Unhashed data files (CSVs, figures) - always revalidate so updates show up
    location /data/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Never cache the SPA shell, so new deploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback for React Router routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
